version: 2
updates:
  - package-ecosystem: "vcpkg"
    directory: "/external"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "vcpkg"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
